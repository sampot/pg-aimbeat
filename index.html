<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120b2e"><meta name="description" content="跟著脈衝節拍點中準星；越接近拍點，連擊越高。"><title>準星節拍</title><link rel="stylesheet" href="./styles.css"></head>
<body><main><header><p class="eyebrow">街機系列</p><h1>準星節拍</h1><p>跟著脈衝節拍點中準星；越接近拍點，連擊越高。</p></header><section class="hud"><span>目前分數 <b id="score">0</b></span><span id="extra">準備中</span><span>最高紀錄 <b id="best">0</b></span></section><p id="status" role="status">準備開始</p><section id="arena" class="arena" aria-label="節拍靶場"><div id="pulse" class="pulse"></div><button id="target" class="target" aria-label="節拍準星"><img id="crosshair" alt=""></button></section><div class="controls"><button id="start">開始 30 秒節拍</button><label>準星<select id="style"><option value="000">環形</option><option value="032">十字</option><option value="078">星芒</option><option value="121">精準</option></select></label></div><details><summary>遊戲說明</summary><p>跟著脈衝節拍點中準星；越接近拍點，連擊越高。</p><p>最高紀錄會同步至 Playgrounds；離線時仍會保存在此裝置。</p></details><footer>素材與授權詳見 ATTRIBUTION.md</footer></main><script type="module" src="./app.js"></script></body></html>
